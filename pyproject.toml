[project]
name = "crossword-app"
version = "0.1.0"
description = "A Flask application for crossword puzzles"
authors = [
    { name = "Your Name", email = "youremail@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "uvicorn>=0.25.0",
    "pydantic>=2.5.2",
    "flask-sqlalchemy>=3.0.0",
    "flask-socketio>=5.5.1",
    "simple-websocket>=1.1.0",
    "qrcode>=8.2",
    "pillow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "ruff==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossword"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "live_provider: private provider integration; requires explicit opt-in",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["vendor", "node_modules", ".venv", ".stryker-tmp"]

[tool.ruff.lint]
# Correctness baseline for legacy Python; style cleanup is separate from CI rollout.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
