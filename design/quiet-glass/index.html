<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crossword · Quiet upgrade</title><style>*{box-sizing:border-box}body{margin:0;background:#090c10;color:#e9edf4;font:14px -apple-system,BlinkMacSystemFont,sans-serif}.review{height:58px;display:flex;align-items:center;gap:8px;padding:10px 22px;border-bottom:1px solid #272d37}.review strong{font-size:14px;margin-right:20px}.review button,.review a{font:inherit;color:#aeb6c2;background:none;border:1px solid transparent;border-radius:7px;padding:8px 12px;cursor:pointer;text-decoration:none}.review button[aria-pressed=true]{background:#262d38;border-color:#454e5e;color:#fff}.review a{margin-left:auto}.caption{margin:0;padding:12px 22px;font-size:13px;color:#aeb6c2}#stage{width:100%;height:calc(100vh - 100px);display:grid;place-items:center}#stage svg{width:100%;height:100%;max-width:2200px}svg [role=button]{cursor:pointer}svg [role=button]:focus{outline:none}svg [role=button]:focus-visible rect{stroke-width:2} @media(max-width:800px){.review{height:auto;flex-wrap:wrap}.review strong{width:100%}#stage{min-width:1000px;height:640px}body{overflow-x:auto}} </style><nav class="review" aria-label="Design review"><strong>Crossword / Quiet upgrade</strong><button data-view="quiet-across" aria-pressed="true">Across selected</button><button data-view="quiet-down" aria-pressed="false">Down selected</button><button data-view="quiet-check" aria-pressed="false">Check state</button><button data-view="quiet-aligned" aria-pressed="false">Compare aligned numbers</button><a href="https://www.figma.com/design/qIu7Tsp0RYRK59sme8zAbS">Figma ↗</a></nav><p class="caption">Same two-lane spines, watermarks and countable boxes. The selection is stronger; the center is quieter. Click 28 Across or 23 Down to compare.</p><main id="stage"></main><script>const stage=document.querySelector('#stage');async function show(name){const r=await fetch(name+'.svg');stage.innerHTML=await r.text();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));for(const [selector,view] of [['#across-28','quiet-across'],['#down-23','quiet-down'],['#command-check','quiet-check']]){let el=stage.querySelector(selector);if(el){el.onclick=()=>show(view);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(view)}}}}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show('quiet-across');</script></html>
